<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>my pet store </title>
    <style>
body{
font-family: Arial, Helvetica, sans-serif;
background-color: lightyellow;
padding: 65px,30px,30px,30px;
min-height: 1800px;    
}
h1, h2{
    color: darkorange;
}
.topbar{
    position: fixed;
    top: 0px;
    left: 0px;
    right: 0px;
    background-color: darkorange;
    color: white;
    padding: 14px,20px;
}
.listitem{
    background-color: whitesmoke;
    border: 2px,solid,darkorange;
    padding: 10px,20px;
    margin: 5px;
}
.specialnote{
    position: relative;
    left: 30px;
    background-color: gold;
    padding:10px 20px ;
}
.petcard{
    position: relative;
    background-color: white;
    border: 3px,solid,darkorange;
    padding: 15px 25px;
}
.badge{
    position:absolute;
    top: 8px;
    right: 8px;
    background-color: forestgreen;
    color: white;
    padding: 4px 8px;
}
.sectionlabel{
    position: sticky;
    top: 55px;
    background-color: darkorange;
    color: white;
    padding: 10px 20px;
    margin: 15px 8px;
}
    </style>
</head>
<body>
    <div class="topbar">my pet page buddy the labrador</div>
    <h1>meet buddy</h1>
    <h2>static</h2>
    <div class="listitem">breed: labrador</div>
    <div class="listitem">age:2years old</div>
    <h2>relative</h2>
    <p>this note shifts to the right</p>
    <div class="petcard"><div>buddy labrador 2years</div>
    <div class="badge">adopted</div></div>

    
</body>
</html>
